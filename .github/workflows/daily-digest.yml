name: Canadian News Daily Digest

on:
  schedule:
    - cron: "*/30 10-17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        run: |
          TODAY=$(TZ="America/New_York" date +%Y-%m-%d)
          HOUR=$(TZ="America/New_York" date +%H)
          echo "Today (America/New_York): $TODAY, hour: $HOUR"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger -- always running (does not update the daily marker)."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "update_marker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HOUR" -lt 7 ]; then
            echo "Before 7 AM local time -- too early, waiting for a later scheduled trigger."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SENT=""
          if [ -f .state/last-sent.txt ]; then
            LAST_SENT=$(cat .state/last-sent.txt)
          fi

          if [ "$LAST_SENT" = "$TODAY" ]; then
            echo "Already sent today's digest ($TODAY) -- skipping this trigger."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Not yet sent today ($TODAY, last sent: ${LAST_SENT:-none}) -- proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "update_marker=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm install

      - name: Run Canadian News AI Agent
        if: steps.gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: npm start

      - name: Record today's send date
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.update_marker == 'true'
        run: |
          mkdir -p .state
          TZ="America/New_York" date +%Y-%m-%d > .state/last-sent.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .state/last-sent.txt
          git commit -m "chore: record digest sent for $(cat .state/last-sent.txt)" || echo "Nothing to commit"
          git push
